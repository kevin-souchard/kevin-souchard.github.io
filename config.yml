          subtitle: "I am a PhD student in my **fourth and final year** at the **[Bordeaux School of Economics](https://www.bse.u-bordeaux.fr/)**, under the supervision of **Maïder Saint Jean** and **Ernest Miguelez**.\n\nMy research lies at the intersection of the **economics of innovation**, **economic geography**, and **environmental economics**, with a particular focus on technological complexity, technology diffusion, regional capabilities, and environmental policy."
